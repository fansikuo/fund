name: 每日14点推送白酒基金(161725)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5'

jobs:
  run-fund:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install requests

      - name: 创建工具文件
        run: |
          cat > MyUtils.py << 'EOF'
          import requests
          import json
          import time

          def getTime():
              return time.strftime("%Y-%m-%d %H:%M:%S", time.localtime())

          def getFundValue(code):
              try:
                  url = f"https://fundgz.1234567.com.cn/js/{code}.js"
                  r = requests.get(url, timeout=10)
                  jsonStr = r.text.replace('jsonpgz(', '').replace(');', '')
                  return json.loads(jsonStr)
              except:
                  return None

          def sendDingDing(webhook, msg):
              headers = {"Content-Type": "application/json"}
              data = {
                  "msgtype": "text",
                  "text": {"content": msg}
              }
              try:
                  requests.post(webhook, headers=headers, json=data)
              except Exception as e:
                  print("发送失败", e)
          EOF

      - name: 重写主程序
        run: |
          cat > FundClient.py << 'EOF'
          # -*- coding: utf-8 -*-
          import MyUtils as util
          import os

          # 直接从环境变量读取钉钉地址（无引号，最稳定）
          dingding = os.environ.get("DING_WEBHOOK")
          codes = ["161725"]

          for code in codes:
              data = util.getFundValue(code)
              if data:
                  name = data['name']
                  gsz = data['gsz']
                  gszzl = data['gszzl']
                  time = data['gztime']
                  msg = f"🍶 白酒基金播报({time})\n名称：{name}\n代码：{code}\n当前估值：{gsz}\n涨跌幅：{gszzl}%"
                  util.sendDingDing(dingding, msg)
                  print("推送成功")
          EOF

      - name: 运行推送
        env:
          DING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        run: python FundClient.py
