name: 每日14点、14点30分推送白酒基金(161725)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5'
    - cron: '30 6 * * 1-5'

jobs:
  run-fund:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install requests
        run: pip install requests

      - name: Run fund push
        env:
          DING_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        run: |
          cat > run.py << 'EOF'
          import requests
          import os

          webhook = os.getenv("DING_WEBHOOK")
          print("Webhook:", webhook)

          url = "https://fundgz.1234567.com.cn/js/161725.js"
          res = requests.get(url)
          data = eval(res.text.replace("jsonpgz(", "").replace(");", ""))

          msg = f"""🍶 白酒基金实时播报
名称：{data['name']}
代码：161725
当前估值：{data['gsz']}
涨跌幅：{data['gszzl']}%
时间：{data['gztime']}"""

          result = requests.post(
              webhook,
              json={
                  "msgtype": "text",
                  "text": {"content": msg}
              }
          )
          print("发送结果：", result.text)
          EOF

          python run.py
