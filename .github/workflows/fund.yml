name: 每日14点、14点30分推送白酒基金(161725)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5'   # 北京时间 14:00
    - cron: '30 6 * * 1-5'  # 北京时间 14:30

jobs:
  run-fund:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install requests

      - name: 运行推送
        env:
          DING_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        run: |
          cat > run.py << 'EOF'
          import requests
          import os

          # 读取你的钉钉机器人地址
          webhook = os.getenv("DING_WEBHOOK")
          print("Webhook：", webhook)

          # 获取 招商中证白酒基金 实时估值（161725）
          url = "https://fundgz.1234567.com.cn/js/161725.js"
          res = requests.get(url)
          data = eval(res.text.replace("jsonpgz(", "").replace(");", ""))

          # 推送内容
          msg = f"""🍶 白酒基金实时播报
名称：{data['name']}
代码：161725
当前估值：{data['gsz']}
涨跌幅：{data['gszzl']}%
时间：{data['gztime']}"""

          # 发送钉钉
          result = requests.post(
              webhook,
              json={
                  "msgtype": "text",
                  "text": {"content": msg}
              }
          )
          print("发送结果：", result.text)
          EOF

          python run.py
