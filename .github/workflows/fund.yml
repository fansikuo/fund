name: 每日14点推送白酒基金
on:
  workflow_dispatch:  # 允许手动测试运行
  schedule:
    - cron: '0 6 * * 1-5'  # 北京时间 14:00 运行（UTC 时间 6:00）

jobs:
  run-fund:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install requests

      - name: 生成配置文件
        run: |
          cat > config.ini << EOF
          [push]
          dingding = "${{ secrets.DINGDING_WEBHOOK }}"
          [fund]
          codes = 161725
          EOF

      - name: 运行基金推送
        run: python FundClient.py
