name: 基金定时推送
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5'
    - cron: '30 6 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run script
        env:
          DING_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        run: |
          python3 << END
          import requests
          import os
          webhook = os.environ.get("DING_WEBHOOK")

          # 要推送的基金代码
          funds = [
              "161725",   # 招商中证白酒
              "012734",   # 易方达中证人工智能ETF联接C
              "512450",   # 畜牧养殖ETF广发
              "018345",   # 华夏中证机器人ETF发起式联接C
              "001940"    # 农银现代农业加
          ]

          msg = "📢 基金实时播报（14:00/14:30）\\n"

          for code in funds:
              try:
                  url = f"https://fundgz.1234567.com.cn/js/{code}.js"
                  res = requests.get(url)
                  data = eval(res.text.strip("jsonpgz();"))
                  name = data['name']
                  gsz = data['gsz']
                  gszzl = data['gszzl']
                  time = data['gztime']
                  msg += f"\\n【{code}】{name}\\n估值：{gsz} | 涨跌：{gszzl}%\\n"
              except:
                  pass

          # 发送钉钉
          requests.post(webhook, json={"msgtype":"text","text":{"content":msg}})
          print("推送成功")
          END
