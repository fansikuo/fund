name: 白酒基金定时推送
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5'
    - cron: '30 6 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run script
        env:
          DING_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        run: |
          python3 << END
          import requests
          import os
          webhook = os.environ.get("DING_WEBHOOK")
          url = "https://fundgz.1234567.com.cn/js/161725.js"
          res = requests.get(url)
          data = eval(res.text.strip("jsonpgz();"))
          msg = "🍶 白酒基金实时播报\n名称：{}\n代码：161725\n估值：{}\n涨跌幅：{}%\n时间：{}".format(data['name'], data['gsz'], data['gszzl'], data['gztime'])
          requests.post(webhook, json={"msgtype":"text","text":{"content":msg}})
          print("推送成功")
          END
