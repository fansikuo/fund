name: 每日14点推送白酒基金(161725)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5'

jobs:
  run-fund:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install requests

      - name: 运行基金推送
        env:
          DING_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        run: |
          cat > run.py << 'EOF'
          import requests
          import os

          # 读取密钥
          webhook = os.getenv("DING_WEBHOOK")
          print("Webhook读取成功：", webhook)

          # 获取白酒基金数据
          res = requests.get("https://fundgz.1234567.com.cn/js/161725.js")
          data = eval(res.text.replace("jsonpgz(", "").replace(");", ""))

          # 推送消息
          msg = "🍶白酒基金播报\n名称:%s\n估值:%s\n涨幅:%s%%\n时间:%s" % (
              data['name'], data['gsz'], data['gszzl'], data['gztime']
          )
          
          resp = requests.post(
              webhook,
              json={"msgtype": "text", "text": {"content": msg}}
          )
          print("推送结果：", resp.text)
          EOF

          python run.py
